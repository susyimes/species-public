name: Bug report
description: Report a reproducible Species defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private room content. Report security issues privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11 / Ubuntu 24.04, Node 24
    validations:
      required: true
